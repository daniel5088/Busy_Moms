<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="bmaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="40" cy="40" r="35" fill="url(#bmaGradient)"/>
  <!-- BMA text in circle -->
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">BMA</text>
  <!-- "Busy Moms Assistant" text -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Busy Moms</text>
  <text x="90" y="52" font-family="Arial, sans-serif" font-size="14" fill="#666">Assistant</text>
</svg>
